<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shimrit Toni Levavi | Video Editor</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #161b22;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --accent: #66fcf1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 3rem 1rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.15rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
            align-items: start;
            margin-bottom: 4rem;
        }

        .video-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .video-wrapper-drive {
            position: relative;
            width: 100%;
            padding-bottom: 177.77%; /* 9:16 aspect ratio */
            height: 0;
            background: #000;
        }

        .video-wrapper-drive iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-footer {
            padding: 0.85rem;
            background-color: #12161c;
            display: flex;
            justify-content: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .ig-link-btn {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .ig-link-btn:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        footer {
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 3rem;
            margin-top: 2rem;
        }

        footer h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        footer p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .contact-btn {
            display: inline-block;
            background-color: var(--accent);
            color: #0b0c10;
            text-decoration: none;
            padding: 0.85rem 2.2rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 1.2rem;
            transition: opacity 0.2s;
        }

        .contact-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 2.2rem; }
            .video-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Shimrit Toni Levavi</h1>
            <p>Video Editor | Instagram Reels, Ads & Podcasts</p>
        </header>

        <main class="video-grid">

            <!-- Video 1: Dr. Ron Fishel (Drive Video Player) -->
            <div class="video-card">
                <div class="video-wrapper-drive">
                    <iframe src="https://drive.google.com/file/d/1IrnjRkh9feJ6J6-a3sDJDoW4liRVNOEs/preview" allow="autoplay; fullscreen"></iframe>
                </div>
                <div class="video-footer">
                    <a href="https://www.instagram.com/reel/DbaG7c7MUxs/" target="_blank" class="ig-link-btn">View Original on Instagram ↗</a>
                </div>
            </div>

            <!-- Video 2: Dana Kanners -->
            <div class="video-card">
                <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/DQHTUxtCNID/?utm_source=ig_embed&amp;utm_campaign=loading" data-instgrm-version="14" style="background:#FFF; border:0; border-radius:12px; margin: 1px; width:100%; min-width:300px; padding:0;"></blockquote>
            </div>

            <!-- Video 3: Nougatine Bakery -->
            <div class="video-card">
                <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/DZJv_4sx5Ym/?utm_source=ig_embed&amp;utm_campaign=loading" data-instgrm-version="14" style="background:#FFF; border:0; border-radius:12px; margin: 1px; width:100%; min-width:300px; padding:0;"></blockquote>
            </div>

            <!-- Video 4: Social Reel -->
            <div class="video-card">
                <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/DNSTSJ2Mnry/?utm_source=ig_embed&amp;utm_campaign=loading" data-instgrm-version="14" style="background:#FFF; border:0; border-radius:12px; margin: 1px; width:100%; min-width:300px; padding:0;"></blockquote>
            </div>

            <!-- Video 5: Portfolio Showcase (Drive) -->
            <div class="video-card">
                <div class="video-wrapper-drive">
                    <iframe src="https://drive.google.com/file/d/14prlTDh8AIiP2Uxem8uNnjHa0QYrJk5S/preview" allow="autoplay; fullscreen"></iframe>
                </div>
                <div class="video-footer">
                    <span style="color: var(--text-muted); font-size: 0.85rem;">Portfolio Showcase Reel</span>
                </div>
            </div>

        </main>

        <footer>
            <h3>Looking for a Video Editor?</h3>
            <p>Available for freelance video editing, Instagram Reels, ads, and podcasts.</p>
            <a href="https://wa.me/972544498497" class="contact-btn">Let's Talk on WhatsApp</a>
        </footer>
    </div>

    <!-- Official Instagram Script -->
    <script async src="//www.instagram.com/embed.js"></script>
</body>
</html>
