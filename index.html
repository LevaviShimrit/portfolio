<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shimrit Toni Levavi | Video Editor</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #161b22;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --accent: #66fcf1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 3rem 1rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.15rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
            align-items: start;
            margin-bottom: 4rem;
        }

        .video-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            padding: 0.5rem;
        }

        .video-wrapper-drive {
            position: relative;
            width: 100%;
            padding-bottom: 177.77%;
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .video-wrapper-drive iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 3rem;
            margin-top: 2rem;
        }

        footer h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        footer p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .contact-btn {
            display: inline-block;
            background-color: var(--accent);
            color: #0b0c10;
            text-decoration: none;
            padding: 0.85rem 2.2rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 1.2rem;
            transition: opacity 0.2s;
        }

        .contact-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 2.2rem; }
            .video-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Shimrit Toni Levavi</h1>
            <p>Video Editor | Instagram Reels, Ads & Podcasts</p>
        </header>

        <main class="video-grid">

            <!-- Video 1: Dr. Fishel Ron -->
            <div class="video-card">
                <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/DbaG7c7MUxs/?utm_source=ig_embed&amp;utm_campaign=loading" data-instgrm-version="14" style="background:#FFF; border:0; border-radius:12px; box-shadow:0 0 1px 0 rgba(0,0,0,0.5),0 1px 10px 0 rgba(0,0,0,0.15); margin: 1px; width:100%; min-width:300px; padding:0;"></blockquote>
            </div>

            <!-- Video 2: Dana Kanners -->
            <div class="video-card">
                <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/DQHTUxtCNID/?utm_source=ig_embed&amp;utm_campaign=loading" data-instgrm-version="14" style="background:#FFF; border:0; border-radius:12px; box-shadow:0 0 1px 0 rgba(0,0,0,0.5),0 1px 10px 0 rgba(0,0,0,0.15); margin: 1px; width:100%; min-width:300px; padding:0;"></blockquote>
            </div>

            <!-- Video 3: Nougatine / Food Reel -->
            <div class="video-card">
                <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/DZJv_4sx5Ym/?utm_source=ig_embed&amp;utm_campaign=loading" data-instgrm-version="14" style="background:#FFF; border:0; border-radius:12px; box-shadow:0 0 1px 0 rgba(0,0,0,0.5),0 1px 10px 0 rgba(0,0,0,0.15); margin: 1px; width:100%; min-width:300px; padding:0;"></blockquote>
            </div>

            <!-- Video 4: Social / Podcast Reel -->
            <div class="video-card">
                <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/DNSTSJ2Mnry/?utm_source=ig_embed&amp;utm_campaign=loading" data-instgrm-version="14" style="background:#FFF; border:0; border-radius:12px; box-shadow:0 0 1px 0 rgba(0,0,0,0.5),0 1px 10px 0 rgba(0,0,0,0.15); margin: 1px; width:100%; min-width:300px; padding:0;"></blockquote>
            </div>

            <!-- Video 5: Google Drive -->
            <div class="video-card" style="width: 100%;">
                <div class="video-wrapper-drive">
                    <iframe src="https://drive.google.com/file/d/14prlTDh8AIiP2Uxem8uNnjHa0QYrJk5S/preview" allow="autoplay; fullscreen"></iframe>
                </div>
            </div>

        </main>

        <footer>
            <h3>Looking for a Video Editor?</h3>
            <p>Available for freelance video editing, Instagram Reels, ads, and podcasts.</p>
            <a href="https://wa.me/972544498497" class="contact-btn">Let's Talk on WhatsApp</a>
        </footer>
    </div>

    <!-- Official Instagram Script with Force Process -->
    <script async src="//www.instagram.com/embed.js"></script>
    <script>
        window.addEventListener('load', function() {
            if (window.instgrm) {
                window.instgrm.Embeds.process();
            }
        });
    </script>
</body>
</html>
